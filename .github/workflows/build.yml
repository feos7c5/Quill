# Builds Quill on a macOS runner with Xcode 27 and uploads an unsigned IPA as an artifact.
# Sign the IPA with your own account before installing.
name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Show tool versions
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: QuillCore

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up dependencies, Rust core and project
        env:
          QUILL_DEVICE_ONLY: "1"
        run: ./setup.sh

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Quill.xcodeproj \
            -scheme Quill \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Quill.xcarchive \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|never)|\*\* (ARCHIVE|BUILD)" || true
          test -d build/Quill.xcarchive/Products/Applications/Quill.app

      - name: Summarize compiler errors
        if: failure()
        run: |
          echo "## Compiler errors" >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:" build.log | sort -u | head -200 | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Package IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/Quill.xcarchive/Products/Applications/Quill.app build/ipa/Payload/
          cd build/ipa && zip -qry ../Quill.ipa Payload
          ls -lh ../Quill.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: Quill-ipa
          path: build/Quill.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
