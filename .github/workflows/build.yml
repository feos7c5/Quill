# Builds Quill on a macOS runner with Xcode 27 and uploads an unsigned IPA as an artifact.
# Sign the IPA with your own account before installing.
name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Show tool versions
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: QuillCore

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up dependencies, Rust core and project
        env:
          QUILL_DEVICE_ONLY: "1"
        run: ./setup.sh

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Quill.xcodeproj \
            -scheme Quill \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Quill.xcarchive \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|never)|\*\* (ARCHIVE|BUILD)" || true
          test -d build/Quill.xcarchive/Products/Applications/Quill.app

      - name: Summarize compiler errors
        if: failure()
        run: |
          echo "## Compiler errors" >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:" build.log | sort -u | head -200 | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Package IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/Quill.xcarchive/Products/Applications/Quill.app build/ipa/Payload/
          cd build/ipa && zip -qry ../Quill.ipa Payload
          ls -lh ../Quill.ipa

      # archive: false stores the .ipa as is, so the download is Quill.ipa instead of a zip.
      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          path: build/Quill.ipa
          archive: false
          if-no-files-found: error

      # Stable download link on the release page.
      - name: Publish IPA as release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Retry: the releases API occasionally answers with HTTP 504.
          for attempt in 1 2 3; do
            gh release delete latest --cleanup-tag --yes 2>/dev/null || true
            if gh release create latest build/Quill.ipa \
                --title "Latest build" \
                --notes "Unsigned IPA built from ${GITHUB_SHA}." \
                --prerelease \
                --target "${GITHUB_SHA}"; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
